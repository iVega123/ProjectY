x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"

x-auth-gate-environment: &auth-gate-environment
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
  ConnectionStrings__Postgresql: "Host=postgres;Port=5432;Database=${AUTH_GATE_POSTGRES_DB:?Set AUTH_GATE_POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  RabbitMQ__UserName: "${AUTH_GATE_RABBITMQ_USER:?Set AUTH_GATE_RABBITMQ_USER in .env}"
  RabbitMQ__Password: "${AUTH_GATE_RABBITMQ_PASSWORD:?Set AUTH_GATE_RABBITMQ_PASSWORD in .env}"
  Messaging__SigningKey: "${RIDER_EVENTS_SIGNING_KEY:?Set RIDER_EVENTS_SIGNING_KEY in .env}"
  Redis__ConnectionString: "redis:6379"
  Jwt__SigningKeys__AuthGate: "${AUTH_GATE_JWT_SIGNING_KEY:?Set AUTH_GATE_JWT_SIGNING_KEY in .env}"
  Jwt__SigningKeys__MotoHub: "${MOTO_HUB_JWT_SIGNING_KEY:?Set MOTO_HUB_JWT_SIGNING_KEY in .env}"
  Jwt__SigningKeys__RiderManager: "${RIDER_MANAGER_JWT_SIGNING_KEY:?Set RIDER_MANAGER_JWT_SIGNING_KEY in .env}"
  Jwt__SigningKeys__RentalOperations: "${RENTAL_OPERATIONS_JWT_SIGNING_KEY:?Set RENTAL_OPERATIONS_JWT_SIGNING_KEY in .env}"

x-rider-manager-environment: &rider-manager-environment
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
  ASPNETCORE_URLS: http://+:8000
  ConnectionStrings__Postgresql: "Host=postgres;Port=5432;Database=${RIDER_MANAGER_POSTGRES_DB:?Set RIDER_MANAGER_POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  RabbitMQ__UserName: "${RIDER_MANAGER_RABBITMQ_USER:?Set RIDER_MANAGER_RABBITMQ_USER in .env}"
  RabbitMQ__Password: "${RIDER_MANAGER_RABBITMQ_PASSWORD:?Set RIDER_MANAGER_RABBITMQ_PASSWORD in .env}"
  Messaging__SigningKey: "${RIDER_EVENTS_SIGNING_KEY:?Set RIDER_EVENTS_SIGNING_KEY in .env}"
  Redis__ConnectionString: "redis:6379"
  MinIO__AccessKey: "${MINIO_USER:?Set MINIO_USER in .env}"
  MinIO__SecretKey: "${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}"
  GatewayIdentity__SigningKey: "${GATEWAY_IDENTITY_SIGNING_KEY:?Set GATEWAY_IDENTITY_SIGNING_KEY in .env}"
  GatewayIdentity__SigningKeyId: local-v1

x-rental-core-environment: &rental-core-environment
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
  ASPNETCORE_URLS: http://+:8200
  # Um banco para o serviço inteiro. Motos, aluguéis, outbox e inbox moram
  # aqui, e é isso que faz criar um aluguel e anunciá-lo caberem numa
  # transação. O schema vem de deploy/db/sql, aplicado pelo cockroach-init.
  ConnectionStrings__Postgresql: "Host=cockroachdb;Port=26257;Database=projecty;Username=root;SSL Mode=Disable"
  RabbitMQ__UserName: "${RENTAL_OPERATIONS_RABBITMQ_USER:?Set RENTAL_OPERATIONS_RABBITMQ_USER in .env}"
  RabbitMQ__Password: "${RENTAL_OPERATIONS_RABBITMQ_PASSWORD:?Set RENTAL_OPERATIONS_RABBITMQ_PASSWORD in .env}"
  Redis__ConnectionString: "redis:6379"
  GatewayIdentity__SigningKey: "${GATEWAY_IDENTITY_SIGNING_KEY:?Set GATEWAY_IDENTITY_SIGNING_KEY in .env}"
  GatewayIdentity__SigningKeyId: local-v1

services:
  media-guard:
    image: projecty/media-guard:dev
    build:
      context: services/media-guard
    networks: [projecty]
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: media-guard
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD", "/app/media-guard", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  otel-collector:
    image: projecty/otel-collector:dev
    build:
      context: ./deploy/observability
      dockerfile: otel-collector.Dockerfile
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    networks:
      - projecty
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
    networks:
      - projecty
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - tempo-data:/var/tempo
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks:
      - projecty
    healthcheck:
      test: ["CMD", "/tempo", "--health", "--health.url=http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./deploy/observability/loki.yaml:/etc/loki/loki.yaml:ro
    networks:
      - projecty
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:?Set GRAFANA_USER in .env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}"
      GF_USERS_DEFAULT_THEME: system
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - projecty
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      AUTH_GATE_POSTGRES_DB: "${AUTH_GATE_POSTGRES_DB:?Set AUTH_GATE_POSTGRES_DB in .env}"
      MOTO_HUB_POSTGRES_DB: "${MOTO_HUB_POSTGRES_DB:?Set MOTO_HUB_POSTGRES_DB in .env}"
      RIDER_MANAGER_POSTGRES_DB: "${RIDER_MANAGER_POSTGRES_DB:?Set RIDER_MANAGER_POSTGRES_DB in .env}"
    ports:
      - "5432:5432"
    networks:
      - projecty
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres && psql -U \"$${POSTGRES_USER}\" -d postgres -tAc \"SELECT 1 WHERE (SELECT count(*) FROM pg_database WHERE datname IN ('$${AUTH_GATE_POSTGRES_DB}', '$${MOTO_HUB_POSTGRES_DB}', '$${RIDER_MANAGER_POSTGRES_DB}')) = 3\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "6379:6379"
    networks:
      - projecty
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - projecty

  # The engine the target schema is written for. It arrives before any row does:
  # #135 moves rentals across with both uniqueness guarantees live at once, and
  # neither can be live if one of the two stores is not running.
  cockroachdb:
    image: cockroachdb/cockroach:v26.3.1
    container_name: cockroachdb
    command: start-single-node --insecure --http-addr=0.0.0.0:8080
    environment:
      COCKROACH_HEALTH_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
    ports:
      - "26257:26257"
      - "26080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    networks:
      - projecty
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --url=\"$${COCKROACH_HEALTH_URL}\" --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Two invocations: the bootstrap creates the database, the portable schema fills
  # it. That is why the entrypoint is a shell rather than `cockroach sql` directly.
  cockroach-init:
    image: cockroachdb/cockroach:v26.3.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cockroach sql --insecure --host=cockroachdb:26257 \
          --file=/sql/000_bootstrap.cockroach.sql
        for file in /sql/0[0-9][0-9]_*.sql; do
          case "$$file" in */000_bootstrap.*) continue ;; esac
          cockroach sql --insecure --host=cockroachdb:26257 --database=projecty --file="$$file"
        done
    volumes:
      - ./deploy/db/sql:/sql:ro
    networks:
      - projecty
    depends_on:
      cockroachdb:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    networks:
      - projecty
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./.rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:?Set MINIO_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - projecty
    command: server /data --console-address ":9001"

  api-gateway:
    image: projecty/api-gateway:dev
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      target: development
    container_name: api-gateway
    stop_grace_period: 30s
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: api-gateway
      GATEWAY_BIND: 0.0.0.0:8090
      GATEWAY_HEALTH_URL: http://127.0.0.1:8090/health/ready
      GATEWAY_UPSTREAM_AUTH_GATE: http://auth-gate:8080
      GATEWAY_UPSTREAM_RIDER_MANAGER: http://rider-manager:8000
      GATEWAY_UPSTREAM_MOTO_HUB: http://rental-core:8200
      GATEWAY_UPSTREAM_RENTAL_OPERATIONS: http://rental-core:8200
      # O billing vive no overlay poliglota. Sem ele de pé, /api/invoices
      # responde 502 -- e não impede o portão de subir, que é o que importa.
      GATEWAY_UPSTREAM_BILLING: http://billing:8094
      GATEWAY_UPSTREAM_AUTH_GATE_TIMEOUT_MS: "1500"
      GATEWAY_UPSTREAM_RIDER_MANAGER_TIMEOUT_MS: "2000"
      GATEWAY_UPSTREAM_MOTO_HUB_TIMEOUT_MS: "2000"
      GATEWAY_UPSTREAM_RENTAL_OPERATIONS_TIMEOUT_MS: "2500"
      GATEWAY_UPSTREAM_BILLING_TIMEOUT_MS: "2000"
      GATEWAY_JWKS_URL: http://auth-gate:8080/.well-known/jwks.json
      GATEWAY_JWT_ISSUER: projecty.identity
      GATEWAY_JWT_AUDIENCE_AUTH_GATE: projecty.auth-gate
      GATEWAY_JWT_AUDIENCE_RIDER_MANAGER: projecty.rider-manager
      GATEWAY_JWT_AUDIENCE_MOTO_HUB: projecty.rental-core
      GATEWAY_JWT_AUDIENCE_RENTAL_OPERATIONS: projecty.rental-core
      # A mesma audiência do rental-core, e não uma nova, deliberadamente.
      #
      # Esta string faz duas coisas: valida o aud do token e vira a audiência
      # do envelope que o portão assina. Uma audiência própria para o billing
      # exigiria um segundo token para a mesma tela -- o console guarda um só,
      # e não tem credenciais para pedir outro. A fatura é a liquidação de um
      # aluguel que o chamador já tem token para ler.
      #
      # É um afrouxamento real: um token do rental-core serve no billing. O
      # #136 troca este esquema inteiro (EdDSA com JWKS, um emissor), e a
      # fronteira certa se desenha lá, uma vez, em vez de aqui, com uma sexta
      # chave HMAC para um esquema que já está de saída.
      GATEWAY_JWT_AUDIENCE_BILLING: projecty.rental-core
      GATEWAY_IDENTITY_SIGNING_KEY: ${GATEWAY_IDENTITY_SIGNING_KEY:?GATEWAY_IDENTITY_SIGNING_KEY is required}
      GATEWAY_IDENTITY_SIGNING_KEY_ID: local-v1
      GATEWAY_REDIS_URL: redis://redis:6379/
      GATEWAY_RATE_LIMIT_REDIS_TIMEOUT_MS: "100"
      GATEWAY_RATE_LIMIT_GENERAL_CAPACITY: "120"
      GATEWAY_RATE_LIMIT_GENERAL_REFILL_PER_MINUTE: "120"
      GATEWAY_RATE_LIMIT_AUTH_CAPACITY: "10"
      GATEWAY_RATE_LIMIT_AUTH_REFILL_PER_MINUTE: "5"
      RUST_LOG: info,api_gateway=debug
    ports:
      - "8090:8090"
    networks:
      - projecty
    healthcheck:
      test: ["CMD", "/workspace/target/debug/api-gateway", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_healthy
      auth-gate:
        condition: service_healthy
      rider-manager:
        condition: service_healthy
      rental-core:
        condition: service_healthy

  auth-gate-migrations:
    image: projecty/auth-gate:dev
    build:
      context: .
      dockerfile: services/AuthGate/AuthGate/Dockerfile
    command: ["--migrate=true"]
    networks:
      - projecty
    environment: *auth-gate-environment
    depends_on:
      postgres:
        condition: service_healthy

  auth-gate:
    image: projecty/auth-gate:dev
    build:
      context: .
      dockerfile: services/AuthGate/AuthGate/Dockerfile
    container_name: auth-gate
    ports:
      - "8080:8080"
      - "8181:8181"
    networks:
      - projecty
    environment:
      <<: [*auth-gate-environment, *otel-environment]
      OTEL_SERVICE_NAME: auth-gate
    healthcheck:
      test: ["CMD", "dotnet", "AuthGate.dll", "--healthcheck", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_healthy
      auth-gate-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  rider-manager-migrations:
    image: projecty/rider-manager:dev
    build:
      context: .
      dockerfile: services/RiderManager/RiderManager/Dockerfile
    command: ["--migrate=true"]
    networks:
      - projecty
    environment: *rider-manager-environment
    depends_on:
      postgres:
        condition: service_healthy

  rider-manager:
    image: projecty/rider-manager:dev
    build:
      context: .
      dockerfile: services/RiderManager/RiderManager/Dockerfile
    container_name: rider-manager
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - projecty
    environment:
      <<: [*rider-manager-environment, *otel-environment]
      OTEL_SERVICE_NAME: rider-manager
    healthcheck:
      test: ["CMD", "dotnet", "RiderManager.dll", "--healthcheck", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_healthy
      rider-manager-migrations:
        condition: service_completed_successfully
      media-guard:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One service where there were two. The gateway sends both /api/motorcycles and
  # /api/rentals here, under one audience, because they are one process now.
  #
  # Não há serviço de migração ao lado: o schema é aplicado pelo cockroach-init,
  # a partir dos mesmos arquivos que o CI prova serem portáteis.
  rental-core:
    image: projecty/rental-core:dev
    build:
      context: .
      dockerfile: services/rental-core/RentalCore/Dockerfile
    container_name: rental-core
    ports:
      - "8200:8200"
      - "8201:8201"
    networks:
      - projecty
    environment:
      <<: [*rental-core-environment, *otel-environment]
      OTEL_SERVICE_NAME: rental-core
    healthcheck:
      test: ["CMD", "dotnet", "RentalCore.dll", "--healthcheck", "http://localhost:8200/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_healthy
      cockroach-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  k6-slo-drill:
    image: grafana/k6:2.2.0
    profiles: ["load"]
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/rental-slo-drill.js"]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),min,max"
      BASE_URL: http://rental-core:8200
      GATEWAY_IDENTITY_SIGNING_KEY: "${GATEWAY_IDENTITY_SIGNING_KEY:?Set GATEWAY_IDENTITY_SIGNING_KEY in .env}"
      GATEWAY_IDENTITY_SIGNING_KEY_ID: local-v1
      SLO_DRILL_SUBJECT: slo-drill-rider
      VUS: "${K6_VUS:-5}"
      DURATION: "${K6_DURATION:-6m}"
    volumes:
      - ./load/k6:/scripts:ro
    networks:
      - projecty
    depends_on:
      rental-core:
        condition: service_healthy
      prometheus:
        condition: service_healthy

networks:
  projecty:
    driver: bridge

volumes:
  postgres-data:
  cockroach-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  grafana-data:
  prometheus-data:
  tempo-data:
  loki-data:

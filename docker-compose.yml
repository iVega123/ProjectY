x-auth-gate-environment: &auth-gate-environment
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
  ConnectionStrings__Postgresql: "Host=postgres;Port=5432;Database=${AUTH_GATE_POSTGRES_DB:?Set AUTH_GATE_POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  RabbitMQ__UserName: "${AUTH_GATE_RABBITMQ_USER:?Set AUTH_GATE_RABBITMQ_USER in .env}"
  RabbitMQ__Password: "${AUTH_GATE_RABBITMQ_PASSWORD:?Set AUTH_GATE_RABBITMQ_PASSWORD in .env}"
  Messaging__SigningKey: "${RIDER_EVENTS_SIGNING_KEY:?Set RIDER_EVENTS_SIGNING_KEY in .env}"
  Redis__ConnectionString: "redis:6379"
  Jwt__SigningKeys__AuthGate: "${AUTH_GATE_JWT_SIGNING_KEY:?Set AUTH_GATE_JWT_SIGNING_KEY in .env}"
  Jwt__SigningKeys__MotoHub: "${MOTO_HUB_JWT_SIGNING_KEY:?Set MOTO_HUB_JWT_SIGNING_KEY in .env}"
  Jwt__SigningKeys__RiderManager: "${RIDER_MANAGER_JWT_SIGNING_KEY:?Set RIDER_MANAGER_JWT_SIGNING_KEY in .env}"
  Jwt__SigningKeys__RentalOperations: "${RENTAL_OPERATIONS_JWT_SIGNING_KEY:?Set RENTAL_OPERATIONS_JWT_SIGNING_KEY in .env}"

x-rider-manager-environment: &rider-manager-environment
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
  ASPNETCORE_URLS: http://+:8000
  ConnectionStrings__Postgresql: "Host=postgres;Port=5432;Database=${RIDER_MANAGER_POSTGRES_DB:?Set RIDER_MANAGER_POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  RabbitMQ__UserName: "${RIDER_MANAGER_RABBITMQ_USER:?Set RIDER_MANAGER_RABBITMQ_USER in .env}"
  RabbitMQ__Password: "${RIDER_MANAGER_RABBITMQ_PASSWORD:?Set RIDER_MANAGER_RABBITMQ_PASSWORD in .env}"
  Messaging__SigningKey: "${RIDER_EVENTS_SIGNING_KEY:?Set RIDER_EVENTS_SIGNING_KEY in .env}"
  Redis__ConnectionString: "redis:6379"
  MinIO__AccessKey: "${MINIO_USER:?Set MINIO_USER in .env}"
  MinIO__SecretKey: "${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}"
  Jwt__SigningKey: "${RIDER_MANAGER_JWT_SIGNING_KEY:?Set RIDER_MANAGER_JWT_SIGNING_KEY in .env}"
  RiderManagerApiKey: "${RIDER_MANAGER_API_KEY:?Set RIDER_MANAGER_API_KEY in .env}"

x-moto-hub-environment: &moto-hub-environment
  ASPNETCORE_ENVIRONMENT: Production
  Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
  ASPNETCORE_URLS: http://+:8100
  ConnectionStrings__Postgresql: "Host=postgres;Port=5432;Database=${MOTO_HUB_POSTGRES_DB:?Set MOTO_HUB_POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  RabbitMQ__UserName: "${MOTO_HUB_RABBITMQ_USER:?Set MOTO_HUB_RABBITMQ_USER in .env}"
  RabbitMQ__Password: "${MOTO_HUB_RABBITMQ_PASSWORD:?Set MOTO_HUB_RABBITMQ_PASSWORD in .env}"
  Redis__ConnectionString: "redis:6379"
  Jwt__SigningKey: "${MOTO_HUB_JWT_SIGNING_KEY:?Set MOTO_HUB_JWT_SIGNING_KEY in .env}"
  MotoHubApiKey: "${MOTO_HUB_API_KEY:?Set MOTO_HUB_API_KEY in .env}"
  RentalOperationsSettings__ApiKey: "${RENTAL_OPERATIONS_API_KEY:?Set RENTAL_OPERATIONS_API_KEY in .env}"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Explicit, not accidental: Elasticsearch 8+ enables security by default.
      # Audit finding A1 documents this stack running without it. Kept visible
      # rather than implicit until issue #63 retires ELK for the LGTM stack.
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.2
    container_name: logstash
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elk

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      AUTH_GATE_POSTGRES_DB: "${AUTH_GATE_POSTGRES_DB:?Set AUTH_GATE_POSTGRES_DB in .env}"
      MOTO_HUB_POSTGRES_DB: "${MOTO_HUB_POSTGRES_DB:?Set MOTO_HUB_POSTGRES_DB in .env}"
      RIDER_MANAGER_POSTGRES_DB: "${RIDER_MANAGER_POSTGRES_DB:?Set RIDER_MANAGER_POSTGRES_DB in .env}"
    ports:
      - "5432:5432"
    networks:
      - elk
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres && psql -U \"$${POSTGRES_USER}\" -d postgres -tAc \"SELECT 1 WHERE (SELECT count(*) FROM pg_database WHERE datname IN ('$${AUTH_GATE_POSTGRES_DB}', '$${MOTO_HUB_POSTGRES_DB}', '$${RIDER_MANAGER_POSTGRES_DB}')) = 3\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "6379:6379"
    networks:
      - elk
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - elk

  mongodb:
    image: mongo:8.3
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:?Set MONGO_USER in .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}"
    volumes:
      - mongo-data:/data/db
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    networks:
      - elk
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./.rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:?Set MINIO_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - elk
    command: server /data --console-address ":9001"

  api-gateway:
    image: projecty/api-gateway:dev
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      target: development
    container_name: api-gateway
    stop_grace_period: 30s
    environment:
      GATEWAY_BIND: 0.0.0.0:8090
      GATEWAY_HEALTH_URL: http://127.0.0.1:8090/health/ready
      GATEWAY_UPSTREAM_AUTH_GATE: http://auth-gate:8080
      GATEWAY_UPSTREAM_RIDER_MANAGER: http://rider-manager:8000
      GATEWAY_UPSTREAM_MOTO_HUB: http://moto-hub:8100
      GATEWAY_UPSTREAM_RENTAL_OPERATIONS: http://rental-operations:8200
      GATEWAY_UPSTREAM_AUTH_GATE_TIMEOUT_MS: "1500"
      GATEWAY_UPSTREAM_RIDER_MANAGER_TIMEOUT_MS: "2000"
      GATEWAY_UPSTREAM_MOTO_HUB_TIMEOUT_MS: "2000"
      GATEWAY_UPSTREAM_RENTAL_OPERATIONS_TIMEOUT_MS: "2500"
      GATEWAY_JWKS_URL: http://auth-gate:8080/.well-known/jwks.json
      GATEWAY_JWT_ISSUER: projecty.identity
      GATEWAY_JWT_AUDIENCE_AUTH_GATE: projecty.auth-gate
      GATEWAY_JWT_AUDIENCE_RIDER_MANAGER: projecty.rider-manager
      GATEWAY_JWT_AUDIENCE_MOTO_HUB: projecty.moto-hub
      GATEWAY_JWT_AUDIENCE_RENTAL_OPERATIONS: projecty.rental-operations
      GATEWAY_IDENTITY_SIGNING_KEY: ${GATEWAY_IDENTITY_SIGNING_KEY:?GATEWAY_IDENTITY_SIGNING_KEY is required}
      GATEWAY_IDENTITY_SIGNING_KEY_ID: local-v1
      GATEWAY_REDIS_URL: redis://redis:6379/
      GATEWAY_RATE_LIMIT_REDIS_TIMEOUT_MS: "100"
      GATEWAY_RATE_LIMIT_GENERAL_CAPACITY: "120"
      GATEWAY_RATE_LIMIT_GENERAL_REFILL_PER_MINUTE: "120"
      GATEWAY_RATE_LIMIT_AUTH_CAPACITY: "10"
      GATEWAY_RATE_LIMIT_AUTH_REFILL_PER_MINUTE: "5"
      RUST_LOG: info,api_gateway=debug
    ports:
      - "8090:8090"
    networks:
      - elk
    healthcheck:
      test: ["CMD", "/workspace/target/debug/api-gateway", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      auth-gate:
        condition: service_healthy
      rider-manager:
        condition: service_healthy
      moto-hub:
        condition: service_healthy
      rental-operations:
        condition: service_healthy

  auth-gate-migrations:
    image: projecty/auth-gate:dev
    build:
      context: .
      dockerfile: AuthGate/AuthGate/Dockerfile
    command: ["--migrate=true"]
    networks:
      - elk
    environment: *auth-gate-environment
    depends_on:
      postgres:
        condition: service_healthy

  auth-gate:
    image: projecty/auth-gate:dev
    build:
      context: .
      dockerfile: AuthGate/AuthGate/Dockerfile
    container_name: auth-gate
    ports:
      - "8080:8080"
      - "8181:8181"
    networks:
      - elk
    environment: *auth-gate-environment
    healthcheck:
      test: ["CMD", "dotnet", "AuthGate.dll", "--healthcheck", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      auth-gate-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  rider-manager-migrations:
    image: projecty/rider-manager:dev
    build:
      context: .
      dockerfile: RiderManager/RiderManager/Dockerfile
    command: ["--migrate=true"]
    networks:
      - elk
    environment: *rider-manager-environment
    depends_on:
      postgres:
        condition: service_healthy

  rider-manager:
    image: projecty/rider-manager:dev
    build:
      context: .
      dockerfile: RiderManager/RiderManager/Dockerfile
    container_name: rider-manager
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - elk
    environment: *rider-manager-environment
    healthcheck:
      test: ["CMD", "dotnet", "RiderManager.dll", "--healthcheck", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      rider-manager-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  moto-hub-migrations:
    image: projecty/moto-hub:dev
    build:
      context: .
      dockerfile: MotoHub/MotoHub/Dockerfile
    command: ["--migrate=true"]
    networks:
      - elk
    environment: *moto-hub-environment
    depends_on:
      postgres:
        condition: service_healthy

  moto-hub:
    image: projecty/moto-hub:dev
    build:
      context: .
      dockerfile: MotoHub/MotoHub/Dockerfile
    container_name: moto-hub
    ports:
      - "8100:8100"
      - "8101:8101"
    networks:
      - elk
    environment: *moto-hub-environment
    healthcheck:
      test: ["CMD", "dotnet", "MotoHub.dll", "--healthcheck", "http://localhost:8100/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      moto-hub-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  rental-operations:
    build:
      context: .
      dockerfile: RentalOperations/RentalOperations/Dockerfile
    container_name: rental-operations
    ports:
      - "8200:8200"
      - "8201:8201"
    networks:
      - elk
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
      ASPNETCORE_URLS: http://+:8200
      MongoDbSettings__ConnectionString: "mongodb://${MONGO_USER:?Set MONGO_USER in .env}:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongodb:27017"
      MongoDbSettings__DatabaseName: "${MONGO_DB:?Set MONGO_DB in .env}"
      RabbitMQ__UserName: "${RENTAL_OPERATIONS_RABBITMQ_USER:?Set RENTAL_OPERATIONS_RABBITMQ_USER in .env}"
      RabbitMQ__Password: "${RENTAL_OPERATIONS_RABBITMQ_PASSWORD:?Set RENTAL_OPERATIONS_RABBITMQ_PASSWORD in .env}"
      Redis__ConnectionString: "redis:6379"
      Jwt__SigningKey: "${RENTAL_OPERATIONS_JWT_SIGNING_KEY:?Set RENTAL_OPERATIONS_JWT_SIGNING_KEY in .env}"
      RentalOperationsApiKey: "${RENTAL_OPERATIONS_API_KEY:?Set RENTAL_OPERATIONS_API_KEY in .env}"
      RiderManagerSettings__ApiKey: "${RIDER_MANAGER_API_KEY:?Set RIDER_MANAGER_API_KEY in .env}"
      MotoHubSettings__ApiKey: "${MOTO_HUB_API_KEY:?Set MOTO_HUB_API_KEY in .env}"
    healthcheck:
      test: ["CMD", "dotnet", "RentalOperations.dll", "--healthcheck", "http://localhost:8200/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      moto-hub:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  elk:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  minio-data:

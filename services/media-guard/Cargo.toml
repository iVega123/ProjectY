[package]
name = "media-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "jpeg"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
opentelemetry = { version = "0.32.0", features = ["logs", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-http = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "logs", "trace"] }
opentelemetry_sdk = { version = "0.32.0", features = ["logs", "rt-tokio", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

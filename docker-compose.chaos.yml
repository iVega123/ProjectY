# Development-only: loaded by Tilt, never by the production entrypoint.
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "127.0.0.1:8474:8474"
    volumes:
      - ./deploy/chaos/toxiproxy-active.json:/config/toxiproxy.json:ro
    networks: [projecty]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  api-gateway:
    environment:
      GATEWAY_REDIS_URL: redis://toxiproxy:6379/
    depends_on:
      toxiproxy:
        condition: service_healthy
  # O emissor atravessa o proxy como todo o resto: um ensaio de latência no
  # banco precisa atingir o login, que é o primeiro passo de quase todo fluxo.
  identity:
    environment:
      IDENTITY_DATABASE_URL: postgres://root@toxiproxy:26257/projecty?sslmode=disable
      MINIO_ENDPOINT: toxiproxy:9000
    depends_on:
      toxiproxy:
        condition: service_healthy

  # Um banco só, e ele atravessa o proxy. Antes eram dois -- o Postgres das
  # motos e o Mongo dos aluguéis -- e um ensaio de latência atingia metade do
  # serviço de cada vez. Agora "banco lento" quer dizer o serviço inteiro lento,
  # que é o que o contrato de degradação sempre afirmou.
  rental-core:
    environment:
      ConnectionStrings__Postgresql: "Host=toxiproxy;Port=26257;Database=projecty;Username=root;SSL Mode=Disable"
      Redis__ConnectionString: toxiproxy:6379
      RabbitMQ__HostName: toxiproxy
    depends_on:
      toxiproxy:
        condition: service_healthy

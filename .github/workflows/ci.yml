name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "epic/**"
      - "task/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  event-contracts:
    name: Event contracts / FULL Protobuf
    runs-on: ubuntu-latest
    services:
      registry:
        image: quay.io/apicurio/apicurio-registry:3.3.2
        ports: ['18081:8080']
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9000/health/ready"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate conventions and registry compatibility
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CONTRACT_BASE_REF" || "$CONTRACT_BASE_REF" =~ ^0+$ ]]; then
            export CONTRACT_BASE_REF=HEAD^
          fi
          node --test contracts/check.test.mjs
          node contracts/check.mjs

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_dotnet_changes: ${{ steps.matrix.outputs.has_dotnet_changes }}
      has_rust_changes: ${{ steps.filter.outputs.api_gateway }}
      has_polyglot_changes: ${{ steps.filter.outputs.polyglot }}
      has_observability_changes: ${{ steps.filter.outputs.observability }}
      has_kubernetes_changes: ${{ steps.filter.outputs.kubernetes }}
      has_terraform_changes: ${{ steps.filter.outputs.terraform }}
      image_matrix: ${{ steps.matrix.outputs.image_matrix }}
      has_image_changes: ${{ steps.matrix.outputs.has_image_changes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose models
        run: |
          docker compose --file docker-compose.yml config --quiet --no-interpolate
          docker compose --file docker-compose.yml --file docker-compose.polyglot.yml config --quiet --no-interpolate
          docker compose --file deploy/overlays/selfhost/compose.yaml config --quiet --no-interpolate

      # O billing não versiona um gradle-wrapper.jar: a versão do Gradle está
      # fixada na imagem base do Dockerfile e no workflow, e este passo é o que
      # impede as duas de divergirem em silêncio -- que é a única coisa que o
      # wrapper garantiria e este repositório ainda não tem.
      - name: Validate the pinned Gradle version
        shell: bash
        run: |
          set -euo pipefail
          image=$(grep -m1 '^FROM gradle:' services/billing/Dockerfile | cut -d: -f2 | cut -d- -f1)
          workflow=$(grep -m1 'gradle-version:' .github/workflows/billing.yml | tr -dc '0-9.')
          test -n "$image" && test "$image" = "$workflow"
      - name: Validate spanmetrics dashboard contract
        shell: bash
        run: |
          metric_prefix=$(awk '$1 == "namespace:" { gsub(/\./, "_", $2); print $2; exit }' deploy/observability/otel-collector.yaml)
          test "$metric_prefix" = "traces_span_metrics"
          grep --recursive --quiet "${metric_prefix}_calls_total" deploy/observability/grafana
          grep --recursive --quiet "${metric_prefix}_duration_milliseconds_bucket" deploy/observability/grafana
          grep --quiet --extended-regexp '^[[:space:]]+unit: ms$' deploy/observability/otel-collector.yaml
          if grep --recursive --quiet "traces_spanmetrics_" deploy/observability/grafana; then exit 1; fi
          grep --fixed-strings --quiet 'service_name=\"rental-core\"' deploy/observability/grafana/dashboards/rental-creation-slo.json
          grep --fixed-strings --quiet 'span_name=~\"POST /?api/Rental/create\"' deploy/observability/grafana/dashboards/rental-creation-slo.json
          grep --fixed-strings --quiet 'http_response_status_code!~\"2..\"' deploy/observability/grafana/dashboards/rental-creation-slo.json
          grep --fixed-strings --quiet 'le=\"2000.0\"' deploy/observability/grafana/dashboards/rental-creation-slo.json
          test ! -e deploy/observability/grafana/dashboards/slo-aluguel.json
          if grep --recursive --quiet 'rental-operations' deploy/observability; then exit 1; fi
          # O guarda acima existia só para os painéis, e o console consulta o
          # mesmo nome sem estar coberto por ele -- foi assim que a renomeação
          # passou, deixando o p99 da tela em null e um smoke esperando um span
          # que ninguém mais emite.
          if grep --recursive --quiet 'rental-operations' services/console/app services/console/lib services/console/test; then exit 1; fi
          grep --fixed-strings --quiet 'value: service_name' deploy/observability/grafana/provisioning/datasources/datasources.yaml
          grep --fixed-strings --quiet 'matcherRegex: trace_id' deploy/observability/grafana/provisioning/datasources/datasources.yaml
          grep --fixed-strings --quiet 'allow_structured_metadata: true' deploy/observability/loki.yaml
          grep --fixed-strings --quiet 'processors: [service-graphs]' deploy/observability/tempo.yaml
          grep --fixed-strings --quiet 'cockroach-data:/cockroach/cockroach-data' docker-compose.yml
          grep --fixed-strings --quiet 'amq\.default|cmd\.rental\.update-licence' scripts/New-LocalSecrets.ps1

      # O achado A9 não volta em silêncio.
      #
      # A correção é um tratador só, e a forma de ela se desfazer é alguém
      # acrescentar um catch-all num controlador -- o que compila, passa nos
      # testes existentes e devolve a mensagem do Npgsql ao cliente de novo.
      # Este passo recusa o PR em vez de esperar a próxima auditoria.
      - name: Refuse exception text in responses
        shell: bash
        run: |
          # A linha de comentário que DESCREVE o defeito não é o defeito: os
          # próprios ClientProblem.cs e o controlador citam o catch-all antigo
          # para explicar por que ele saiu.
          leaks=$(grep -rn --include='*.cs' \
            -E '(BadRequest|Conflict|NotFound|StatusCode|Problem)\([^)]*\b(ex|exception|error)\.Message' \
            services/rental-core/RentalCore Shared \
            | grep -v -E ':[[:space:]]*(///|//|\*)' || true)
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "A9: an exception message must not reach a client. Throw a ClientProblemException instead."
            exit 1
          fi
          # E o tratador continua ligado: registrado E no pipeline.
          grep --quiet 'AddExceptionHandler<RentalCore.Errors.ProblemDetailsExceptionHandler>' services/rental-core/RentalCore/Program.cs
          grep --quiet 'app.UseExceptionHandler()' services/rental-core/RentalCore/Program.cs

      - name: Validate command queue upgrade
        shell: pwsh
        run: ./scripts/Test-CommandQueueNames.ps1

      - name: Validate shared application topology
        shell: pwsh
        run: ./scripts/Test-PlatformModel.ps1

      - name: Validate application telemetry exporters
        shell: bash
        run: |
          for project in \
            services/rental-core/RentalCore/RentalCore.csproj; do
            grep --quiet 'OpenTelemetry.Exporter.OpenTelemetryProtocol' "$project"
            grep --quiet 'Serilog.Sinks.OpenTelemetry' "$project"
            grep --quiet 'Shared\\Observability' "$project"
          done
          # O identity exporta pelo SDK do Go, sem projeto .NET onde procurar
          # pacote: o guarda equivalente é o pacote existir e o servidor estar
          # embrulhado nele.
          grep --quiet 'otlptracehttp' services/identity/internal/telemetry/telemetry.go
          grep --quiet 'otelhttp.NewHandler' services/identity/cmd/identity/main.go
          grep --quiet 'AddAspNetCoreInstrumentation' Shared/Observability/ProjectYTelemetryExtensions.cs
          grep --quiet 'AddHttpClientInstrumentation' Shared/Observability/ProjectYTelemetryExtensions.cs
          grep --quiet 'WriteTo.OpenTelemetry' Shared/Observability/ProjectYTelemetryExtensions.cs
          grep --quiet 'opentelemetry-otlp' services/api-gateway/Cargo.toml
          grep --quiet 'OpenTelemetryTracingBridge' services/api-gateway/src/telemetry.rs
          grep --quiet 'HeaderInjector' services/api-gateway/src/lib.rs

      - name: Detect relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rental_core:
              - 'services/rental-core/**'
              - 'contracts/**'
              - 'services/risk-pricing/pricing-policy.json'
              - 'Shared/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.grype.yaml'
              - '.trivyignore.yaml'
              - 'global.json'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'NuGet.config'
            api_gateway:
              - 'services/api-gateway/**'
              - '.github/workflows/ci.yml'
              - '.grype.yaml'
              - '.trivyignore.yaml'
            observability:
              - 'deploy/observability/**'
              - 'docker-compose.yml'
              - 'Tiltfile'
              - 'logstash/**'
              - '.github/workflows/ci.yml'
            kubernetes:
              - 'deploy/base/**'
              - 'deploy/kind/**'
              - 'deploy/overlays/aws/**'
              - 'deploy/overlays/selfhost/**'
              - 'deploy/platform/kyverno/**'
              - 'deploy/platform/cert-manager/**'
              - 'scripts/kind/**'
              - 'scripts/Test-Kubernetes*.ps1'
              - 'scripts/Test-ExternalSecrets.ps1'
              - 'scripts/Test-IngressTls.ps1'
              - 'Tiltfile'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/**'
              - '.terraform-version'
              - '.tflint.hcl'
              - '.github/workflows/ci.yml'
            polyglot:
              - 'services/media-guard/**'
              - 'services/telemetry/**'
              - 'services/risk-pricing/**'
              - 'services/console/**'
              - 'services/billing/**'
              - 'services/identity/**'
              - 'deploy/db/sql/**'
              - 'contracts/**'
              - '.github/workflows/*.yml'
              - '.dockerignore'

      - name: Build CI matrices
        id: matrix
        shell: bash
        env:
          RENTAL_CORE_CHANGED: ${{ steps.filter.outputs.rental_core }}
          API_GATEWAY_CHANGED: ${{ steps.filter.outputs.api_gateway }}
          POLYGLOT_CHANGED: ${{ steps.filter.outputs.polyglot }}
        run: |
          matrix='{"include":[]}'
          image_matrix='{"include":[]}'

          add_service() {
            local service="$1"
            local solution="$2"
            local image="$3"
            local context="$4"
            local dockerfile="$5"
            local repository="$6"
            matrix=$(jq --compact-output \
              --arg service "$service" \
              --arg solution "$solution" \
              '.include += [{language: "dotnet", service: $service, solution: $solution}]' \
              <<< "$matrix")
            image_matrix=$(jq --compact-output \
              --arg service "$service" \
              --arg image "$image" \
              --arg context "$context" \
              --arg dockerfile "$dockerfile" \
              --arg repository "$repository" \
              '.include += [{service: $service, image: $image, context: $context, dockerfile: $dockerfile, repository: $repository}]' \
              <<< "$image_matrix")
          }

          if [[ "$RENTAL_CORE_CHANGED" == "true" ]]; then
            add_service "RentalCore" "services/rental-core/RentalCore.sln" "rental-core" "." "services/rental-core/RentalCore/Dockerfile" "ghcr.io/ivega123/projecty/rental-core"
          fi
          if [[ "$API_GATEWAY_CHANGED" == "true" ]]; then
            image_matrix=$(jq --compact-output \
              '.include += [{service: "api-gateway", image: "api-gateway", context: "services/api-gateway", dockerfile: "services/api-gateway/Dockerfile", repository: "ghcr.io/ivega123/projecty/api-gateway"}]' \
              <<< "$image_matrix")
          fi

          if [[ "$POLYGLOT_CHANGED" == "true" ]]; then
            for service in media-guard telemetry risk-pricing console billing identity; do
              context="services/$service"
              # Três compilam da raiz: o risk-pricing gera de contracts/, e o
              # billing e o identity leem contracts/ e deploy/db/sql.
              if [[ "$service" == "risk-pricing" || "$service" == "billing" || "$service" == "identity" ]]; then context="."; fi
              image_matrix=$(jq --compact-output --arg service "$service" --arg context "$context" \
                '.include += [{service: $service, image: $service, context: $context, dockerfile: ("services/" + $service + "/Dockerfile"), repository: ("ghcr.io/ivega123/projecty/" + $service)}]' \
                <<< "$image_matrix")
            done
          fi

          {
            echo "matrix=$matrix"
            echo "has_dotnet_changes=$(jq --raw-output '.include | length > 0' <<< "$matrix")"
            echo "image_matrix=$image_matrix"
            echo "has_image_changes=$(jq --raw-output '.include | length > 0' <<< "$image_matrix")"
          } >> "$GITHUB_OUTPUT"

  media-tests:
    needs: changes
    if: needs.changes.outputs.has_polyglot_changes == 'true'
    uses: ./.github/workflows/polyglot.yml
  telemetry-tests:
    needs: changes
    if: needs.changes.outputs.has_polyglot_changes == 'true'
    uses: ./.github/workflows/telemetry.yml
  risk-tests:
    needs: changes
    if: needs.changes.outputs.has_polyglot_changes == 'true'
    uses: ./.github/workflows/risk-pricing.yml
  console-tests:
    needs: changes
    if: needs.changes.outputs.has_polyglot_changes == 'true'
    uses: ./.github/workflows/console.yml
  billing-tests:
    needs: changes
    if: needs.changes.outputs.has_polyglot_changes == 'true'
    uses: ./.github/workflows/billing.yml
  identity-tests:
    needs: changes
    if: needs.changes.outputs.has_polyglot_changes == 'true'
    uses: ./.github/workflows/identity.yml

  observability:
    name: Observability stack
    needs: changes
    if: needs.changes.outputs.has_observability_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate ephemeral local credentials
        shell: pwsh
        run: ./scripts/New-LocalSecrets.ps1

      - name: Verify Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/deploy/observability:/observability:ro" \
            prom/prometheus:v3.14.0 \
            check rules \
              /observability/rules/outbox.yml \
              /observability/rules/risk-staleness.yml \
              /observability/rules/rental-creation-slo.yml
          docker run --rm --entrypoint promtool \
            --volume "$PWD/deploy/observability:/observability:ro" \
            prom/prometheus:v3.14.0 \
            test rules /observability/tests/rental-creation-slo.test.yml

      - name: Validate rental SLO drill
        run: |
          docker run --rm \
            --volume "$PWD/load/k6:/scripts:ro" \
            grafana/k6:2.2.0 \
            inspect \
              --env GATEWAY_IDENTITY_SIGNING_KEY=00000000000000000000000000000000 \
              /scripts/rental-slo-drill.js

      - name: Start LGTM stack
        run: |
          docker compose --env-file .env up --build --detach --wait --wait-timeout 240 \
            tempo loki otel-collector prometheus grafana

      - name: Verify Grafana provisioning and datasource health
        shell: bash
        run: |
          grafana_user=$(awk -F= '$1 == "GRAFANA_USER" { print $2 }' .env)
          grafana_password=$(awk -F= '$1 == "GRAFANA_PASSWORD" { print $2 }' .env)

          for uid in prometheus tempo loki; do
            curl --fail --silent --show-error \
              --user "$grafana_user:$grafana_password" \
              "http://localhost:3000/api/datasources/uid/$uid/health" \
              | jq --exit-status '.status == "OK"' >/dev/null
          done

          curl --fail --silent --show-error \
            --user "$grafana_user:$grafana_password" \
            'http://localhost:3000/api/search?type=dash-db' \
            | jq --exit-status \
              '[.[] | select(.folderTitle == "ProjectY")] | length == 3' >/dev/null

      - name: Print observability logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color tempo loki otel-collector prometheus grafana

      - name: Stop LGTM stack
        if: always()
        run: docker compose --env-file .env down --volumes

  dotnet:
    name: .NET / ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.has_dotnet_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ matrix.solution }}"

      - name: Lint and verify formatting
        run: dotnet format "${{ matrix.solution }}" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "${{ matrix.solution }}" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "${{ matrix.solution }}" --configuration Release --no-build --logger "trx;LogFileName=${{ matrix.service }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: "**/TestResults/${{ matrix.service }}.trx"
          if-no-files-found: warn

  no_relevant_changes:
    name: No relevant service changes
    needs: changes
    if: needs.changes.outputs.has_dotnet_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No .NET service paths changed; service jobs were skipped."

  rust:
    name: Rust / api-gateway
    needs: changes
    if: needs.changes.outputs.has_rust_changes == 'true'
    runs-on: ubuntu-latest
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.0

      - name: Verify formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

  images:
    name: Image security / ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.has_image_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create artifact directory
        shell: bash
        run: mkdir -p artifacts

      - name: Build attested OCI image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: projecty/${{ matrix.image }}:ci-${{ github.sha }}
          outputs: type=oci,dest=artifacts/${{ matrix.image }}-oci,tar=false,oci-mediatypes=true
          provenance: false
          sbom: true

      - name: Verify OCI SBOM attestation
        shell: bash
        env:
          OCI_LAYOUT: artifacts/${{ matrix.image }}-oci
        run: |
          test -f "$OCI_LAYOUT/index.json"
          if ! grep --extended-regexp --recursive --binary-files=text --quiet \
            '"predicateType"[[:space:]]*:[[:space:]]*"https://spdx.dev/Document"' \
            "$OCI_LAYOUT/blobs"; then
            echo "::error::The OCI image does not contain an SPDX SBOM attestation."
            exit 1
          fi

      - name: Generate SPDX SBOM with Syft
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: oci-dir:artifacts/${{ matrix.image }}-oci
          format: spdx-json
          output-file: artifacts/${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}
          upload-artifact: false
          syft-version: v1.51.1

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: artifacts/${{ matrix.image }}.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: false
          output-format: table
          grype-version: v0.118.0

      - name: Scan OCI image with Trivy
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: artifacts/${{ matrix.image }}-oci
          scanners: vuln
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          version: v0.74.0

      - name: Upload SBOM and attested OCI image
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-security-${{ matrix.image }}-${{ github.sha }}
          path: |
            artifacts/${{ matrix.image }}.spdx.json
            artifacts/${{ matrix.image }}-oci
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish and sign / ${{ matrix.service }}
    needs:
      - changes
      - images
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.has_image_changes == 'true' &&
      needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    steps:
      - name: Download scanned OCI image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: image-security-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-security

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned OCI image
        id: publish
        shell: bash
        env:
          IMAGE: ${{ matrix.repository }}
          OCI_LAYOUT: ${{ runner.temp }}/image-security/${{ matrix.image }}-oci
        run: |
          test -f "$OCI_LAYOUT/index.json"

          manifest_count=$(jq '[.manifests[]] | length' "$OCI_LAYOUT/index.json")
          if [[ "$manifest_count" != "1" ]]; then
            echo "::error::Expected exactly one root manifest in the OCI layout; found $manifest_count."
            exit 1
          fi

          local_digest=$(jq --raw-output '.manifests[0].digest' "$OCI_LAYOUT/index.json")
          if [[ ! "$local_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The OCI layout does not contain a valid sha256 root digest."
            exit 1
          fi

          oras cp --from-oci-layout --recursive \
            "$OCI_LAYOUT@$local_digest" \
            "$IMAGE:$GITHUB_SHA"

          remote_digest=$(oras resolve "$IMAGE:$GITHUB_SHA")
          if [[ "$remote_digest" != "$local_digest" ]]; then
            echo "::error::Published digest $remote_digest differs from scanned digest $local_digest."
            exit 1
          fi

          echo "digest=$remote_digest" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the published image
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ matrix.repository }}
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity="$SIGNING_IDENTITY" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Publish SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify published provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ matrix.repository }}
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"

      - name: Promote verified image to latest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ matrix.repository }}
        run: oras tag "$IMAGE@$DIGEST" latest

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the scanner rejects a canary
        shell: bash
        run: |
          canary_file="$RUNNER_TEMP/gitleaks-canary.txt"
          trap 'rm -f "$canary_file"' EXIT
          printf '%s%s\n' 'PROJECTY_GITLEAKS_' 'CANARY_0123456789ABCDEF' > "$canary_file"

          if docker run --rm --network none \
            --volume "$canary_file:/scan/canary.txt:ro" \
            --volume "$GITHUB_WORKSPACE/.gitleaks.toml:/scan/.gitleaks.toml:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            dir --config /scan/.gitleaks.toml --redact=100 --no-banner /scan/canary.txt; then
            echo "::error::Gitleaks accepted the synthetic secret canary."
            exit 1
          fi

      - name: Scan proposed commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.0

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Render and validate every deployment overlay
        shell: pwsh
        run: ./scripts/Test-KubernetesManifests.ps1

      - name: Validate enforced signed-image policy
        shell: pwsh
        run: |
          $tools = ./scripts/kind/Install-ProjectYKubernetesTools.ps1
          $policy = (& $tools.Kubectl kustomize deploy/platform/kyverno) -join "`n"
          if ($LASTEXITCODE -ne 0 -or
              $policy -notmatch '(?m)^  validationActions:\s*$' -or
              $policy -notmatch '(?m)^  - Deny\s*$' -or
              $policy -notmatch 'mutateDigest: true' -or
              $policy -notmatch 'url: https://rekor.sigstore.dev') {
            throw 'The signed-image admission policy is not enforced.'
          }

  kubernetes-security:
    name: Kubernetes security acceptance
    needs: changes
    if: needs.changes.outputs.has_kubernetes_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate ephemeral local credentials
        shell: pwsh
        run: ./scripts/New-LocalSecrets.ps1

      - name: Provision kind, Calico and ingress
        shell: pwsh
        run: ./scripts/kind/Ensure-ProjectYCluster.ps1

      - name: Install External Secrets and publish the local backend
        shell: pwsh
        run: |
          ./scripts/kind/Install-ExternalSecrets.ps1
          ./scripts/kind/Publish-LocalSecretBackend.ps1
          $tools = ./scripts/kind/Install-ProjectYKubernetesTools.ps1
          & $tools.Kubectl apply -f deploy/base/namespace.yaml
          & $tools.Kubectl apply --namespace projecty -f deploy/base/serviceaccounts.yaml
          & $tools.Kubectl apply -f deploy/overlays/selfhost/local-secret-store.yaml
          & $tools.Kubectl apply --namespace projecty -f deploy/base/external-secrets.yaml
          & $tools.Kubectl apply --namespace projecty -f deploy/base/network-policies.yaml

      - name: Verify Pod Security, network ownership and secret synchronization
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          ./scripts/Test-KubernetesSecurity.ps1 | Tee-Object artifacts/kubernetes-isolation.json
          ./scripts/Test-ExternalSecrets.ps1 | Tee-Object artifacts/external-secrets.json

      - name: Verify signed-image admission
        shell: pwsh
        run: |
          ./scripts/kind/Install-Kyverno.ps1
          ./scripts/Test-SignedAdmission.ps1 | Tee-Object artifacts/signed-admission.json

      - name: Verify TLS at the ingress
        shell: pwsh
        run: |
          $tools = ./scripts/kind/Install-ProjectYKubernetesTools.ps1
          ./scripts/kind/Install-CertManager.ps1
          & $tools.Kubectl apply --namespace projecty -f deploy/base/ingress.yaml
          ./scripts/Test-IngressTls.ps1 -UseFixtureBackends | Tee-Object artifacts/ingress-tls.json

      - name: Upload reproducible acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-security-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the ephemeral cluster
        if: always()
        shell: pwsh
        run: ./scripts/kind/Remove-ProjectYCluster.ps1

  terraform:
    name: Terraform / fmt, validate and policy
    needs: changes
    if: needs.changes.outputs.has_terraform_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Verify canonical formatting
        run: terraform fmt -check -recursive infra

      - name: Verify state-layer blast-radius boundaries
        shell: pwsh
        run: ./scripts/Test-TerraformLayers.ps1

      - name: Verify per-service AWS workload identity
        shell: pwsh
        run: ./scripts/Test-AwsIdentityPolicies.ps1

      - name: Validate every Terraform root without contacting a backend
        run: |
          for root in infra/tests/aws-modules infra/bootstrap infra/envs/aws-mid/*; do
            [[ -d "$root" ]] || continue
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate -no-color
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Lint every Terraform root and module
        run: tflint --chdir=infra --recursive --format=compact

      - name: Scan Terraform policy
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false

  required:
    name: Required
    needs:
      - event-contracts
      - changes
      - observability
      - dotnet
      - no_relevant_changes
      - rust
      - images
      - publish
      - secrets
      - kubernetes-manifests
      - kubernetes-security
      - terraform
      - media-tests
      - telemetry-tests
      - risk-tests
      - console-tests
      - billing-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACTS_RESULT: ${{ needs.event-contracts.result }}
          OBSERVABILITY_RESULT: ${{ needs.observability.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          NO_CHANGES_RESULT: ${{ needs.no_relevant_changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes-manifests.result }}
          KUBERNETES_SECURITY_RESULT: ${{ needs.kubernetes-security.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          MEDIA_RESULT: ${{ needs.media-tests.result }}
          TELEMETRY_RESULT: ${{ needs.telemetry-tests.result }}
          RISK_RESULT: ${{ needs.risk-tests.result }}
          CONSOLE_RESULT: ${{ needs.console-tests.result }}
          BILLING_RESULT: ${{ needs.billing-tests.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HAS_IMAGE_CHANGES: ${{ needs.changes.outputs.has_image_changes }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$CONTRACTS_RESULT" == "success" ]]
          [[ "$OBSERVABILITY_RESULT" == "success" || "$OBSERVABILITY_RESULT" == "skipped" ]]
          [[ "$DOTNET_RESULT" == "success" || "$NO_CHANGES_RESULT" == "success" ]]
          [[ "$RUST_RESULT" == "success" || "$RUST_RESULT" == "skipped" ]]
          [[ "$IMAGES_RESULT" == "success" || "$IMAGES_RESULT" == "skipped" ]]
          [[ "$SECRETS_RESULT" == "success" ]]
          [[ "$KUBERNETES_RESULT" == "success" ]]
          [[ "$KUBERNETES_SECURITY_RESULT" == "success" || "$KUBERNETES_SECURITY_RESULT" == "skipped" ]]
          [[ "$TERRAFORM_RESULT" == "success" || "$TERRAFORM_RESULT" == "skipped" ]]
          for result in "$MEDIA_RESULT" "$TELEMETRY_RESULT" "$RISK_RESULT" "$CONSOLE_RESULT" "$BILLING_RESULT"; do
            [[ "$result" == "success" || "$result" == "skipped" ]]
          done

          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" && "$HAS_IMAGE_CHANGES" == "true" ]]; then
            [[ "$PUBLISH_RESULT" == "success" ]]
          else
            [[ "$PUBLISH_RESULT" == "skipped" ]]
          fi

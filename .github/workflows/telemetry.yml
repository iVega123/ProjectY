name: Live tracking
on:
  workflow_call:
permissions: {contents: read}
jobs:
  telemetry:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.4'
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: services/telemetry
      - run: mix format --check-formatted && mix test
        working-directory: services/telemetry
      # credo for readability and design, sobelow for security. Both found
      # nothing once .credo.exs dropped the @moduledoc check, so both block.
      - run: mix credo && mix sobelow --exit
        working-directory: services/telemetry

name: Rental load gate
on:
  pull_request:
    paths:
      - 'services/identity/**'
      - 'services/rental-core/**'
      - 'Shared/**'
      - 'services/api-gateway/**'
      - 'docker-compose*.yml'
      - 'deploy/**'
      - 'load/**'
      - 'scripts/Run-LoadTest.ps1'
      - 'scripts/Invoke-Chaos.ps1'
      - 'scripts/New-LocalSecrets.ps1'
      - 'scripts/Update-CommandQueueNames.ps1'
      - '.github/workflows/load.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rental-load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured-rental-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify token refresh across long workloads
        run: node --test load/tests/token-refresh.test.mjs
      - name: Build isolated stack and enforce rental thresholds
        shell: pwsh
        run: ./scripts/Run-LoadTest.ps1
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-load-results
          path: load/results/*.json
          if-no-files-found: warn

  # The full polyglot build takes most of a runner's budget, so this acceptance
  # runs on demand rather than on every pull request.
  two-rental-core-replicas:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Two replicas drain one Kafka backlog, each event once
        shell: pwsh
        run: ./scripts/Test-RentalCoreReplicas.ps1
      - name: Upload replica results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-core-replica-results
          path: load/results/*.json
          if-no-files-found: warn

version: 2

updates:
  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/deploy/base"
    target-branch: epic/5-local-development-loop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Manaus
    groups:
      container-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/AuthGate/AuthGate"
      - "/MotoHub/MotoHub"
      - "/RentalOperations/RentalOperations"
      - "/RiderManager/RiderManager"
    target-branch: epic/5-local-development-loop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Manaus
    groups:
      dotnet-base-images:
        patterns:
          - "mcr.microsoft.com/dotnet/*"

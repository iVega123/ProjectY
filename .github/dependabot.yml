version: 2

updates:
  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/deploy/base"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Manaus
    groups:
      # Minor and patch bumps travel together; majors arrive as individual PRs
      # so each one can be reviewed and smoke-tested on its own. A bundle of
      # sixteen updates where one breaks the stack is not reviewable.
      container-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directories:
      - "/AuthGate/AuthGate"
      - "/MotoHub/MotoHub"
      - "/RentalOperations/RentalOperations"
      - "/RiderManager/RiderManager"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Manaus
    groups:
      dotnet-base-images:
        patterns:
          - "mcr.microsoft.com/dotnet/*"
        update-types:
          - "minor"
          - "patch"

# The name carries the newest migration in deploy/db/sql. Re-applying a Job that
# already completed does not run it again, so a fixed name would let a new
# migration reach the binaries that need it without ever reaching the database
# (#59). A new name is a new Job, and every migration is idempotent, so it runs
# the whole schema once more. scripts/Test-KubernetesManifests.ps1 fails when a
# migration is added without renaming this.
apiVersion: batch/v1
kind: Job
metadata: {name: cockroach-schema-007}
spec:
  backoffLimit: 12
  template:
    metadata:
      labels: {app.kubernetes.io/name: cockroach-schema, projecty.io/tier: setup}
    spec:
      serviceAccountName: cockroach-schema
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: schema
          image: projecty/cockroach-schema:dev
          env: [{name: COCKROACH_HOST, value: cockroachdb:26257}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policy.yaml
patches:
  - target:
      group: policies.kyverno.io
      version: v1beta1
      kind: ImageValidatingPolicy
      name: verify-projecty-images
    patch: |-
      - op: replace
        path: /spec/validationActions/0
        value: Deny
      - op: replace
        path: /spec/validationConfigurations/mutateDigest
        value: true

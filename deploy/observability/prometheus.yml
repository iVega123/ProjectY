global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: projecty-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Métricas RED derivadas dos traces pelo connector spanmetrics.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Serviços que expõem /metrics diretamente.
  - job_name: projecty-services
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8090"]
        labels: { service: api-gateway, language: rust }
      - targets: ["media-guard:8092"]
        labels: { service: media-guard, language: rust }
      - targets: ["risk-pricing:8093"]
        labels: { service: risk-pricing, language: python }
      - targets: ["telemetry:4000"]
        labels: { service: telemetry, language: elixir }
      - targets: ["auth-gate:8080"]
        labels: { service: auth-gate, language: dotnet }
      - targets: ["moto-hub:8100"]
        labels: { service: moto-hub, language: dotnet }
    # Um serviço fora do ar não deve derrubar o scrape dos outros.
    honor_labels: true

  - job_name: infra
    static_configs:
      - targets: ["prometheus:9090"]
      - targets: ["tempo:3200"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  allow_structured_metadata: true
  # Mantém trace_id e service_name como rótulos: é o que liga log↔trace no Grafana.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

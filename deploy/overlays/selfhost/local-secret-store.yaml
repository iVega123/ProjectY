apiVersion: v1
kind: Namespace
metadata: {name: projecty-secrets}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: projecty-secret-reader, namespace: projecty-secrets}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [projecty-runtime-source]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: projecty-secret-reader, namespace: projecty-secrets}
subjects:
  - kind: ServiceAccount
    name: external-secrets-reader
    namespace: projecty
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: projecty-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: projecty-secrets, namespace: projecty}
spec:
  provider:
    kubernetes:
      remoteNamespace: projecty-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-reader

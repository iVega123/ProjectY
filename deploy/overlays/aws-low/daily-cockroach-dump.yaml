apiVersion: v1
kind: ServiceAccount
metadata:
  name: cockroach-backup
  namespace: projecty
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cockroach-daily-dump
  namespace: projecty
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cockroach-backup
            projecty.io/tier: setup
        spec:
          serviceAccountName: cockroach-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: logical-dump
              image: postgres:18.0-alpine3.22
              command: [/bin/sh, -ec]
              args:
                - pg_dumpall --dbname='postgresql://root@cockroachdb:26257/defaultdb?sslmode=disable' --no-role-passwords > /dump/projecty.sql
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: dump, mountPath: /dump}]
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.31.13
              command: [/bin/sh, -ec]
              args:
                - |
                  account="$(aws sts get-caller-identity --query Account --output text)"
                  stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  aws s3 cp /dump/projecty.sql "s3://projecty-${account}-${AWS_REGION}-low-dumps/cockroach/${stamp}.sql"
              env:
                - name: AWS_REGION
                  value: us-east-1
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 256Mi}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: dump, mountPath: /dump}]
          volumes: [{name: dump, emptyDir: {sizeLimit: 2Gi}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cockroach-backup-egress
  namespace: projecty
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cockroach-backup}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: cockroachdb}}
      ports: [{protocol: TCP, port: 26257}]
    - ports: [{protocol: TCP, port: 443}]
